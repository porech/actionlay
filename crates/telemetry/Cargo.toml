[package]
name = "actionlay-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
geographiclib-rs.workspace = true
thiserror.workspace = true
log.workspace = true
fitparser = "0.11"
quick-xml = "0.39"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
telemetry-parser = "0.2.6"

[dev-dependencies]
# Only the integration tests read real MP4 files; the library itself never
# links FFmpeg (checked by `cargo tree -e normal` in CI).
actionlay-media = { path = "../media" }

[features]
# Public constructors used by other crates' tests (render goldens). Never enabled in release builds.
test-util = []

[[test]]
name = "contract_additions"
required-features = ["test-util"]
