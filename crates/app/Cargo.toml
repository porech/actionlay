[package]
name = "actionlay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "actionlay"
path = "src/main.rs"

[dependencies]
actionlay-media = { path = "../media" }
actionlay-layout = { path = "../layout" }
actionlay-render = { path = "../render" }
actionlay-telemetry = { path = "../telemetry" }
actionlay-maps = { path = "../maps" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui-wgpu = "0.36"
bytemuck = { version = "1", features = ["derive"] }
log.workspace = true
env_logger = "0.11"
rfd = "0.17"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
clap.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
ctrlc = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"

[dev-dependencies]
anyhow.workspace = true
naga = { version = "30", features = ["wgsl-in"] }
