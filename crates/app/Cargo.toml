[package]
name = "actionlay-app"
description = "Action-camera telemetry dashboards and video export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "actionlay"
path = "src/main.rs"

[dependencies]
actionlay-media = { path = "../media" }
actionlay-layout = { path = "../layout" }
actionlay-render = { path = "../render" }
actionlay-telemetry = { path = "../telemetry" }
actionlay-maps = { path = "../maps" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui-wgpu = "0.36"
bytemuck = { version = "1", features = ["derive"] }
log.workspace = true
env_logger = "0.11"
rfd = "0.17"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
clap.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
ctrlc = "3.5"
sys-locale = "0.3"
regex = "1"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
arabic_reshaper = "0.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSNotification", "NSAppleEventDescriptor", "NSAppleEventManager", "objc2-core-services"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
anyhow.workspace = true
naga = { version = "30", features = ["wgsl-in"] }

[build-dependencies]
winresource = "0.1.31"
