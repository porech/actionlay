[package]
name = "actionlay-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
actionlay-layout = { path = "../layout" }
actionlay-telemetry = { path = "../telemetry" }
actionlay-maps = { path = "../maps" }
tiny-skia.workspace = true
cosmic-text.workspace = true
resvg.workspace = true
chrono = { workspace = true, features = ["clock"] }
log.workspace = true
fontdb = { version = "0.23", default-features = false, features = ["fs", "fontconfig"] }
serde_json.workspace = true

[dev-dependencies]
resvg = { workspace = true, features = ["text"] }
actionlay-telemetry = { path = "../telemetry", features = ["test-util"] }
serde_json.workspace = true
