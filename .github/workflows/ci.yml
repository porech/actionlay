name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Work to run
        type: choice
        default: build
        options:
          - build
          - pages
          - aur
      release_tag:
        description: Stable tag to publish in aur mode (later than v1.4.2)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.mode || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  web:
    if: ${{ inputs.mode != 'pages' && inputs.mode != 'aur' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build isolated browser application
        run: bash scripts/build-web.sh
      - name: Test AUR recipe generation
        run: python3 scripts/test-prepare-aur.py
      - name: Check backend isolation
        run: bash scripts/check-backend-isolation.sh
      - name: Install media fixture tools
        timeout-minutes: 10
        run: |
          # The Azure mirror has occasionally downloaded at ~100 KiB/s. Use
          # Ubuntu's official mirror with the same signed package metadata.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/80-actionlay-ci >/dev/null <<'APT'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - name: Test browser persistence and media
        run: |
          npm --prefix web test
          cd web
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: actionlay-web
          path: web/dist

  build-test:
    if: ${{ inputs.mode != 'pages' && inputs.mode != 'aur' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Verify stable tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      # Synthetic samples only change with their script; the ffmpeg CLI that
      # generates them is installed only on a cache miss.
      - name: Cache synthetic samples (macOS/Linux)
        id: samples-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: samples/synthetic
          key: samples-${{ matrix.target }}-${{ hashFiles('scripts/make-synthetic-samples.sh') }}

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm cmake pkg-config
          if [ "${{ steps.samples-cache.outputs.cache-hit }}" != "true" ]; then brew install ffmpeg; fi

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake pkg-config libva-dev libasound2-dev
          if [ "${{ steps.samples-cache.outputs.cache-hit }}" != "true" ]; then sudo apt-get install -y ffmpeg; fi

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools not found" }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          $command = "call `"$devCmd`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          $variables = & $env:ComSpec /d /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed: $LASTEXITCODE" }
          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ([Environment]::GetEnvironmentVariable($name) -cne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      - name: MSYS2 tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make nasm diffutils git pkgconf

      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg-version.env', 'scripts/build-ffmpeg.sh', 'scripts/build-encoders.sh') }}

      - name: Build FFmpeg (macOS/Linux)
        if: runner.os != 'Windows'
        run: make ffmpeg

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if [ -f /usr/bin/link.exe ]; then mv /usr/bin/link.exe /usr/bin/link.exe.bak; fi
          make ffmpeg

      - name: Export FFMPEG_DIR
        run: echo "FFMPEG_DIR=$GITHUB_WORKSPACE/third_party/ffmpeg/${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # Git Bash puts its own /usr/bin/link.exe (coreutils) ahead of MSVC's
      # linker, so point cargo at MSVC's link.exe explicitly.
      - name: MSVC linker for cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -CommandType Application | Where-Object { $_.Source -like '*MSVC*' } | Select-Object -First 1).Source
          if (-not $link) { throw "MSVC link.exe not found on PATH" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Caches the registry and compiled dependencies (not our own crates).
      # The key includes the FFmpeg build inputs: ffmpeg-sys-next's bindings
      # would otherwise survive an FFmpeg upgrade at the same FFMPEG_DIR path.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg-version.env', 'scripts/build-ffmpeg.sh', 'scripts/build-encoders.sh') }}
          cache-on-failure: true

      - name: Synthetic samples (macOS/Linux)
        if: runner.os != 'Windows' && steps.samples-cache.outputs.cache-hit != 'true'
        run: make synthetic-samples

      - name: Export ACTIONLAY_SAMPLES (macOS/Linux)
        if: runner.os != 'Windows'
        run: echo "ACTIONLAY_SAMPLES=$GITHUB_WORKSPACE/samples/synthetic" >> "$GITHUB_ENV"

      # Public GoPro samples (Apache-2.0) for the telemetry tests. Plain
      # downloads, so every OS gets them; fetched only when the pinned list
      # in the script changes.
      - name: Cache GoPro samples
        id: gopro-cache
        uses: actions/cache@v6
        with:
          path: samples/gopro/*.mp4
          key: gopro-samples-${{ hashFiles('scripts/fetch-gopro-samples.sh') }}

      - name: Fetch GoPro samples (macOS/Linux)
        if: runner.os != 'Windows' && steps.gopro-cache.outputs.cache-hit != 'true'
        run: make gopro-samples

      - name: Fetch GoPro samples (Windows)
        if: runner.os == 'Windows' && steps.gopro-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make gopro-samples

      - name: Require GoPro samples in tests
        run: echo "ACTIONLAY_REQUIRE_GOPRO_SAMPLES=1" >> "$GITHUB_ENV"

      - name: Private sample stays out of tests and CI
        run: |
          if grep -rn "GX013370" crates scripts .github --exclude=ci.yml; then
            echo "samples/GX013370.MP4 is private: tests and CI must not use it" >&2
            exit 1
          fi

      - name: Telemetry crate stays free of FFmpeg
        run: |
          if cargo tree -p actionlay-telemetry -e normal --prefix none | grep -i ffmpeg; then
            echo "actionlay-telemetry must not depend on FFmpeg" >&2
            exit 1
          fi

      - name: Desktop backends stay isolated from browser dependencies
        run: bash scripts/check-backend-isolation.sh

      - name: Check formatting (macOS/Linux)
        if: runner.os != 'Windows'
        run: make fmt-check

      - name: Check formatting (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make fmt-check
      - name: Run Clippy (macOS/Linux)
        if: runner.os != 'Windows'
        run: make clippy

      - name: Run Clippy (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clippy
      # Player tests open the audio device and are timing-sensitive, so they
      # must not run concurrently. Every other test is fast; running the whole
      # workspace single-threaded keeps each test running exactly once (a
      # per-target split cannot exclude only tests/player.rs, and
      # `--exclude actionlay-media` fails while it is the only member).
      - name: Run workspace tests (macOS/Linux)
        if: runner.os != 'Windows'
        run: make test

      - name: Run workspace tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

      - name: Repeat buffering regressions (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/test-buffering-stability.sh
      - name: Repeat buffering regressions (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/test-buffering-stability.sh

      - name: Upload golden image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-${{ matrix.target }}
          path: target/golden-diff
          if-no-files-found: ignore

      - name: Build release binaries (macOS/Linux)
        if: runner.os != 'Windows'
        run: make build

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make build

      - name: Verify Windows executable icons and metadata
        if: runner.os == 'Windows'
        run: python scripts/verify-windows-resources.py target/release/actionlay.exe

      - name: Package pinned dependency sources
        if: runner.os == 'Linux'
        run: python3 scripts/package-sources.py
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: third-party-sources
          path: dist/third-party-sources-*.tar.gz
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: actionlay-${{ matrix.target }}
          path: |
            target/release/actionlay
            target/release/actionlay.exe
            target/release/decode-bench
            target/release/decode-bench.exe
            target/release/actionlay-telemetry
            target/release/actionlay-telemetry.exe
          if-no-files-found: error

  package-windows:
    needs: build-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: actionlay-x86_64-pc-windows-msvc
          path: binaries
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          python scripts/package-release.py --target windows --binaries binaries --output dist
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches[0].Groups[1].Value
          Expand-Archive "dist/actionlay-$version-windows-x64.zip" dist/windows
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\dist\windows\ActionLay" "/DOutputDir=$pwd\dist" packaging/windows/actionlay.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $parsed = [Version]$version
          $upgrade = "$($parsed.Major).$($parsed.Minor).$($parsed.Build + 1)"
          & $iscc "/DAppVersion=$upgrade" "/DSourceDir=$pwd\dist\windows\ActionLay" "/DOutputDir=$pwd\dist\upgrade" packaging/windows/actionlay.iss
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade test installer compilation failed' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UPGRADE_VERSION=$upgrade" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify installer scopes, upgrade and uninstall
        shell: pwsh
        run: scripts/verify-windows-installer.ps1 -Installer "$pwd\dist\actionlay-$env:APP_VERSION-windows-x64-setup.exe" -UpgradeInstaller "$pwd\dist\upgrade\actionlay-$env:UPGRADE_VERSION-windows-x64-setup.exe" -UpgradeVersion "$env:UPGRADE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/actionlay-*-windows-x64-setup.exe
          if-no-files-found: error

  package-linux:
    needs: build-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: actionlay-x86_64-unknown-linux-gnu
          path: binaries
      - name: Install native packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils shared-mime-info libglib2.0-bin libasound2 libva2 libva-drm2
      - name: Build DEB and RPM packages
        run: python3 scripts/package-linux.py --binaries binaries --output dist
      - name: Verify package contents and DEB installation
        run: |
          sudo dpkg -i dist/*.deb
          desktop-file-validate /usr/share/applications/org.ActionLay.ActionLay.desktop
          actionlay-telemetry --version
          cp crates/app/tests/fixtures/export-source.mp4 /tmp/actionlay-test.lrv
          # Desktop detectors may identify the MP4 container rather than its
          # camera-specific subtype. ActionLay must be offered for both.
          detected="$(xdg-mime query filetype /tmp/actionlay-test.lrv)"
          echo "LRV detected as: $detected"
          case "$detected" in video/x-actionlay-lrv|video/mp4) ;; *) exit 1 ;; esac
          for mime in video/mp4 video/quicktime video/x-actionlay-lrv video/x-actionlay-insv; do
            gio mime "$mime" | grep -F org.ActionLay.ActionLay.desktop
          done
          grep -F 'video/x-actionlay-lrv:*.lrv' /usr/share/mime/globs2
          grep -F 'video/x-actionlay-insv:*.insv' /usr/share/mime/globs2
          rpm -qpl dist/*.rpm | grep -Fx /usr/bin/actionlay
          sudo dpkg -r actionlay
          test ! -e /usr/share/applications/org.ActionLay.ActionLay.desktop
      - name: Verify RPM installation on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:latest bash -c '
            dnf install -y /packages/*.rpm >/dev/null &&
            actionlay-telemetry --version &&
            test -e /usr/share/applications/org.ActionLay.ActionLay.desktop &&
            dnf remove -y actionlay >/dev/null &&
            test ! -e /usr/share/applications/org.ActionLay.ActionLay.desktop'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-native-packages
          path: dist/*
          if-no-files-found: error

  package-arch:
    name: Check Arch/AUR package
    needs: build-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: actionlay-x86_64-unknown-linux-gnu
          path: binaries
      - name: Prepare checksum-pinned AUR recipe from tested binaries
        run: |
          python3 scripts/package-release.py --target linux --binaries binaries --output arch-dist
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python3 scripts/prepare-aur.py --version "$version" --archive "arch-dist/actionlay-$version-linux-x64.tar.gz" --output arch-recipe
      - name: Build, lint, install, reinstall and remove the Arch package
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/verify-aur.sh arch-recipe "arch-dist/actionlay-$version-linux-x64.tar.gz" arch-verified
      - name: Verify signed pacman repository with a real Arch client
        run: bash scripts/pages/test-arch-repository.sh arch-verified
      - uses: actions/upload-artifact@v7
        with:
          name: aur-package-check
          path: arch-verified
          include-hidden-files: true
          if-no-files-found: error

  package:
    needs: [build-test, web, package-windows, package-linux, package-arch]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: actionlay-*
          path: binaries
      - name: Package universal macOS application and DMG
        run: bash scripts/package-macos.sh binaries/actionlay-aarch64-apple-darwin binaries/actionlay-x86_64-apple-darwin dist
      - name: Package Windows and Linux
        run: |
          python3 scripts/package-release.py --target windows --binaries binaries/actionlay-x86_64-pc-windows-msvc --output dist
          python3 scripts/package-release.py --target linux --binaries binaries/actionlay-x86_64-unknown-linux-gnu --output dist
      - uses: actions/download-artifact@v8
        with:
          name: third-party-sources
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-native-packages
          path: dist
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: aur-package-check
          path: arch-verified
      - name: Include verified Arch package in stable releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp arch-verified/*.pkg.tar.zst dist/
      - name: Package browser application for stable tags only
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          tar -czf "dist/actionlay-web-$version.tar.gz" -C binaries/actionlay-web .
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 actionlay-* actionlay_* third-party-sources-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh

  linux-repositories:
    name: Publish Pages and Linux repositories
    needs: publish
    if: >-
      always() && !cancelled() && inputs.mode != 'aur' &&
      ((needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'pages'))
    concurrency:
      group: actionlay-pages
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      # Create a unique publication commit object without moving branches/tags.
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Test browser publication verification
        run: |
          python3 scripts/pages/test-verify-browser.py
          python3 scripts/pages/test-render-index.py
          node --test scripts/pages/test-deploy.cjs
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev createrepo-c rpm gnupg
      - name: Download current stable and development packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/stable packages/nightly
          stable="$(gh release view --json tagName --jq .tagName)"
          for channel in stable nightly; do
            tag="$stable"
            if [ "$channel" = nightly ]; then tag=nightly; fi
            # Older releases have no native packages yet. Do not advertise an
            # unsigned or empty repository for those releases.
            count="$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".deb") or endswith(".rpm"))] | length')"
            if [ "$count" -gt 0 ]; then
              gh release download "$tag" --pattern '*.deb' --pattern '*.rpm' --dir "packages/$channel"
            fi
          done
          arch_count="$(gh release view "$stable" --json assets --jq '[.assets[].name | select(endswith(".pkg.tar.zst"))] | length')"
          if [ "$arch_count" -gt 0 ]; then
            gh release download "$stable" --pattern '*.pkg.tar.zst' --dir packages/stable
          fi
      - name: Import dedicated repository signing key
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY"
          install -d -m 700 "$RUNNER_TEMP/actionlay-gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/actionlay-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$PRIVATE_KEY" | gpg --homedir "$RUNNER_TEMP/actionlay-gnupg" --batch --import
          gpg --homedir "$RUNNER_TEMP/actionlay-gnupg" --batch --import packaging/linux/repository-key.asc
          fingerprint="$(gpg --homedir "$RUNNER_TEMP/actionlay-gnupg" --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          expected="$(gpg --show-keys --with-colons packaging/linux/repository-key.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          test "$fingerprint" = "$expected"
          echo "GPG_FPR=$fingerprint" >> "$GITHUB_ENV"
      - name: Build and verify signed repositories
        run: |
          mkdir -p site
          for channel in stable nightly; do
            if compgen -G "packages/$channel/*.deb" > /dev/null; then
              bash scripts/pages/build-repositories.sh "packages/$channel" site "$channel"
              gpg --verify "site/$channel/apt/InRelease"
              gpg --verify "site/$channel/rpm/repodata/repomd.xml.asc" "site/$channel/rpm/repodata/repomd.xml"
            fi
          done
          if compgen -G "packages/stable/*.pkg.tar.zst" > /dev/null; then
            bash scripts/pages/build-arch-repository.sh packages/stable site/packages/stable/arch/x86_64
          fi
          test -e site/nightly/apt/InRelease
      # Reuse the last stable tag's bundle, including on main/nightly runs.
      # Never build or publish the browser app from an untagged commit.
      - name: Download stable browser release for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable="$(gh release view --json tagName --jq .tagName)"
          echo "Publishing browser bundle from $stable"
          count="$(gh release view "$stable" --json assets --jq '[.assets[].name | select(startswith("actionlay-web-") and endswith(".tar.gz"))] | length')"
          if [ "$count" -gt 0 ]; then
            test "$count" -eq 1
            mkdir -p browser-release site/web
            gh release download "$stable" --pattern 'actionlay-web-*.tar.gz' --dir browser-release
            tar -xzf browser-release/actionlay-web-*.tar.gz -C site/web
            test -f site/web/index.html
          fi
          # Public instructions/assets come from the released tag, even on main.
          git fetch --no-tags origin "refs/tags/$stable:refs/tags/$stable"
          git restore --source "$stable" -- scripts/pages/render-index.py scripts/pages/landing.html scripts/pages/landing.css scripts/pages/landing.js
          ACTIONLAY_STABLE_TAG="$stable" python3 scripts/pages/render-index.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload-pages
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      # Upload completion can precede visibility in the REST list used by deploy-pages.
      # Unique attempt names also prevent retries from selecting older artifacts.
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.upload-pages.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.id == $PAGES_ARTIFACT_ID) | .name")"
            if [ "$found" = "$PAGES_ARTIFACT_NAME" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact did not become visible within 60 seconds" >&2
          exit 1
      - name: Deploy repositories
        id: deploy
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload-pages.outputs.artifact_id }}
        with:
          script: |
            const { deploy } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pages/deploy.cjs`);
            await deploy({ github, core, context,
              artifactId: process.env.PAGES_ARTIFACT_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT });
      - name: Verify published browser bundle
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          if [ -f site/web/index.html ]; then
            python3 scripts/pages/verify-browser.py site/web "${PAGES_URL%/}/web/"
          fi
      - name: Remove temporary signing keyring
        if: always()
        run: rm -rf "$RUNNER_TEMP/actionlay-gnupg"

  publish-aur:
    name: Publish stable AUR recipe
    needs: publish
    if: >-
      always() && !cancelled() &&
      ((needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'aur'))
    runs-on: ubuntu-22.04
    concurrency:
      group: actionlay-aur
      cancel-in-progress: false
    env:
      AUR_PUBLISH_ENABLED: ${{ vars.AUR_PUBLISH_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      AUR_TAG: ${{ inputs.release_tag || github.ref_name }}
      AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
      AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
    steps:
      - name: Validate the requested stable release
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['AUR_TAG']
          if os.environ['AUR_PUBLISH_ENABLED'] != 'true':
              raise SystemExit('Configure AUR credentials and enable AUR_PUBLISH_ENABLED first')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tuple(map(int, tag[1:].split('.'))) <= (1, 4, 2):
              raise SystemExit('AUR publication starts after v1.4.2')
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$AUR_TAG" --jq '(.draft == false and .prerelease == false)' | grep -Fx true
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUR_TAG }}
      - name: Prepare recipe from the immutable published archive
        run: |
          gh release download "$AUR_TAG" --repo "$GITHUB_REPOSITORY" --pattern "actionlay-${AUR_TAG#v}-linux-x64.tar.gz" --pattern SHA256SUMS --dir release-assets
          python3 scripts/prepare-aur.py --version "${AUR_TAG#v}" --archive "release-assets/actionlay-${AUR_TAG#v}-linux-x64.tar.gz" --checksums release-assets/SHA256SUMS --output aur-recipe
      - name: Verify the published release package on Arch
        run: bash scripts/verify-aur.sh aur-recipe "release-assets/actionlay-${AUR_TAG#v}-linux-x64.tar.gz" aur-verified
      - name: Configure AUR SSH identity
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          test -n "$AUR_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Publish validated PKGBUILD and SRCINFO
        run: bash scripts/publish-aur.sh aur-verified
