[workspace]
resolver = "3"
members = ["crates/media", "crates/app", "crates/telemetry", "crates/telemetry-cli", "crates/layout", "crates/render", "crates/maps", "crates/web"]

default-members = ["crates/media", "crates/app", "crates/telemetry", "crates/telemetry-cli", "crates/layout", "crates/render", "crates/maps"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "static"] }
crossbeam-channel = "0.5"
cpal = "0.18"
ringbuf = "0.5"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
geographiclib-rs = "0.2.7"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
jsonschema = { version = "0.58", default-features = false }
tiny-skia = "0.12"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
resvg = { version = "0.48", default-features = false }
directories = "6"
